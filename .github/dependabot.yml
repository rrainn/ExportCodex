version: 2

updates:
  # Group routine Rust updates so dependency maintenance stays reviewable.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: "15:00"
      timezone: America/Denver
    open-pull-requests-limit: 5
    groups:
      rust-dependencies:
        patterns:
          - "*"

  # Keep workflow actions current without mixing them into application changes.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: "15:30"
      timezone: America/Denver
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

